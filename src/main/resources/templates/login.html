<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Log in')}"></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container">
  <section class="card form-card">
    <h2>Welcome back 👋</h2>
    <p class="muted" style="margin-bottom:1rem">Log in to manage jobs and applications.</p>
    <div class="alert error" th:if="${param.error}">Invalid email or password.</div>
    <div class="alert success" th:if="${param.logout}">You have been logged out.</div>
    <form class="stack" th:action="@{/login}" method="post">
      <label>Email <input type="email" name="email" required autofocus></label>
      <label>Password <input type="password" name="password" required></label>
      <button class="btn btn-lg" type="submit">Log in</button>
    </form>
    <p class="muted small" style="margin-top:1rem">New here? <a th:href="@{/register}">Create an account</a></p>
    <div class="demo">
      <b>Demo accounts</b><br>
      Admin: <code>admin@workwave.com</code> / <code>admin123</code><br>
      Employer: <code>hr@techcorp.com</code> / <code>employer123</code><br>
      Job seeker: <code>candidate@workwave.com</code> / <code>seeker123</code>
    </div>
  </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
