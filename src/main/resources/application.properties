spring.application.name=workwave
server.port=8080

# Embedded H2 database stored in ./data (swap for MySQL/PostgreSQL later)
spring.datasource.url=jdbc:h2:file:./data/workwave;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

spring.thymeleaf.cache=false
